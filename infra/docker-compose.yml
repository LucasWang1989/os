services:
  mysql:
    image: mysql:8.0.36
    container_name: scan2dine-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      TZ: Pacific/Auckland
    volumes:
      - /data/mysqldata:/var/lib/mysql
    restart: unless-stopped
    # ports:
    #   - "${MYSQL_PORT}:3306"

  backend:
    image: ${BACKEND_IMAGE}
    container_name: scan2dine-api-service
    depends_on:
      - mysql
    environment:
      SERVER_PORT: 8041
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Pacific/Auckland
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      SPRING_FLYWAY_ENABLED: "true"
      TZ: Pacific/Auckland
    expose:
      - "8041"
#    ports:
#      - "${BACKEND_PORT}:8041"
    restart: unless-stopped

  frontend:
    image: ${FRONTEND_IMAGE}
    container_name: scan2dine-customer-web
    depends_on:
      - backend
    expose:
      - "3000"
#    ports:
#      - "${FRONTEND_PORT}:3000"
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: scan2dine-nginx
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"

      # - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

